<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>갑신종교고등학교 홈페이지</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, "Noto Sans KR", sans-serif;
    background: #f4f5f7;
    color: #202124;
  }
  header {
    background: #17191d;
    color: white;
    padding: 18px 20px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .top {
    max-width: 900px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo { font-size: 22px; font-weight: 800; letter-spacing: 2px; }
  .status { font-size: 12px; color: #aeb4bd; }
  main { max-width: 900px; margin: 0 auto; padding: 45px 18px 80px; }
  .hero { text-align: center; margin-bottom: 30px; }
  .hero h1 { font-size: 42px; margin: 0 0 10px; }
  .hero p { color: #68707c; margin: 0; }
  .search {
    display: flex;
    gap: 8px;
    margin: 25px auto 35px;
    max-width: 680px;
  }
  input {
    flex: 1;
    min-width: 0;
    padding: 16px 18px;
    border: 1px solid #cfd3d9;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
    background: white;
  }
  input:focus { border-color: #555; }
  button {
    border: 0;
    border-radius: 10px;
    padding: 0 22px;
    background: #202124;
    color: white;
    font-size: 15px;
    cursor: pointer;
  }
  button:hover { opacity: .85; }
  .chips { text-align: center; margin-bottom: 35px; }
  .chip {
    display: inline-block;
    background: white;
    border: 1px solid #d8dbe0;
    color: #505761;
    padding: 8px 12px;
    border-radius: 20px;
    margin: 4px;
    cursor: pointer;
    font-size: 13px;
  }
  .section-title { font-size: 18px; font-weight: 700; margin: 25px 0 12px; }
  .card {
    background: white;
    border: 1px solid #e0e3e7;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .card:hover { border-color: #9ca1a8; }
  .meta { color: #8a919b; font-size: 12px; margin-bottom: 8px; }
  .card h3 { margin: 0 0 8px; font-size: 17px; }
  .preview { color: #5d6570; font-size: 14px; line-height: 1.5; }
  .tag {
    display: inline-block;
    margin-top: 12px;
    padding: 4px 7px;
    border-radius: 5px;
    background: #eef0f3;
    color: #626a75;
    font-size: 11px;
  }
  .hidden { display: none; }
  .back {
    display: inline-block;
    margin-bottom: 20px;
    color: #5d6570;
    cursor: pointer;
    font-size: 14px;
  }
  .post {
    background: white;
    border: 1px solid #e0e3e7;
    border-radius: 12px;
    padding: 25px;
  }
  .post h1 { margin: 0 0 12px; font-size: 27px; }
  .post-body {
    line-height: 1.8;
    white-space: pre-line;
    margin-top: 25px;
  }
  .author-id { margin-top: 18px; padding-top: 12px; border-top: 1px solid #eceef1; color: #777f89; font-size: 13px; }
  .author-id code { font-family: monospace; color: #333; }
  .comment {
    border-top: 1px solid #eceef1;
    padding: 15px 0;
    margin-top: 20px;
  }
  .comment strong { font-size: 13px; }
  .comment p { margin: 6px 0 0; color: #555d67; font-size: 14px; }
  .no-result {
    text-align: center;
    padding: 45px 10px;
    color: #777f89;
  }
  .clue {
    margin-top: 25px;
    padding: 15px;
    background: #fff8d9;
    border-left: 4px solid #c7a900;
    font-size: 14px;
    line-height: 1.6;
  }
  footer {
    text-align: center;
    color: #9298a1;
    font-size: 11px;
    padding: 30px;
  }

.author-id{margin-top:20px;padding-top:12px;border-top:1px solid #eee;color:#777;font-size:13px}.author-id code{font-family:monospace;color:#333}
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="logo">TRACE</div>
    <div class="status">PUBLIC SEARCH ARCHIVE</div>
  </div>
</header>

<main>
  <section id="home">
    <div class="hero">
      <h1>갑신종교고등학교 홈페이지</h1>
    </div>

    <div class="search">
      <input id="searchInput" type="text" placeholder="검색어를 입력하세요" autocomplete="off">
      <button onclick="search()">검색</button>
    </div>

  </section>

  <section id="results" class="hidden">
    <div class="back" onclick="goHome()">← 검색으로 돌아가기</div>
    <div class="section-title" id="resultTitle"></div>
    <div id="resultList"></div>
  </section>

  <section id="postPage" class="hidden">
    <div class="back" onclick="goResults()">← 검색 결과로 돌아가기</div>
    <article id="postContent"></article>
  </section>
</main>

<footer>갑신종교고등학교 홈페이지</footer>

<script>
const posts = [
{id:1,title:"3학년 2반인데 수요일 임시시간표 아는 사람",author:"3heart20909",body:`임시시간표 뭔지 모르는데 알려주실분`,comments:[["익명","수환쌤한테 물어보세요. 3학년 2반 담임 쌤입니다."],["익명","자기 임시 시간표도 모르는 3평ㅋㅋ"]]},
{id:2,title:"체육관에서 뭔 행사 함?",author:"ki3gadq7f",body:`권태쌤 도우러 체육관 갔는데 연주쌤이랑 미선쌤 의자 깔고 있던데\n뭔 행사 함?`,comments:[["익명","아마 학부모 종교과정 설명회 할 걸? 나도 들은거라 잘 모르긴 함"],["익명","권태쌤이 체육쌤임?"],["↳ 익명","ㅇㅇ"]]},
{id:3,title:"종교 과정 설명회 참석해본 사람",author:"Doitmyself_0",body:`나 이번에 가는데 뭐하는거임?`,comments:[["익명","국어쌤이랑 음악쌤이 뭐 하던데"],["↳ 익명","국어쌤이랑 음악쌤 누구?"],["↳↳ 익명","국어쌤은 연장쌤이고 음악쌤은 현주쌤임"],["익명","이 학교에서 무엇을 공부하고, 어떤 종교 이념을 가지는지 알려줌"]]},
{id:4,title:"작년에 졸업식 할 때 수환쌤 무대에 불러서 춤추게 시킨 쌤이 누구지?",author:"3512_leeheonju",body:`갑자기 기억이 안남\n참고로 아직 갑신종교고 다님;;;`,comments:[["익명","2학년 5반 담임이였는데 누구였지,,"],["↳ 익명","권태샘이잖아 빡대야;;"],["↳↳ 익명","아 맞다맞다 권태쌤이 졸업식 담당이구나"]]},
{id:5,title:"수학 수행평가 아는 사람!",author:"EEMM",body:`나 3학년임`,comments:[["익명","이차방정식 문제 푸는거랑 하나 뭐 있었는데 수환쌤한테 ㄱㄱ"]]},
{id:6,title:"이번 체육대회 레전드ㅋㅋㅋ",author:"enfj_1231",body:`3반 들어오는데 내 친구가 담임쌤 끌어당겨서 국어쌤 넘어짐ㅋㅎㅋㅎㅋㅎㅋ\n근데 썅 가발 벗겨짐ㅌㅋㅋㅋ카카칵하하`,comments:[["익명","이거 연장쌤이 보시겠다ㅋ"],["익명","헉 이걸 쌤도 있는 커뮤니티에 올리다니 대범하군."]]},
{id:7,title:"안뇽하세요! 이번에 들어오는 병아리입니당",author:"kimoppa_1",body:`혹시 1학년 담임쌤 누군지 알려주실 수 있나요?ㅎㅎ 제가 잘 몰라서요..ㅠㅠ`,comments:[["익명",`한번만 말함 잘드으셔\n1반 : 박지은 쌤\n2반 : 김여원 쌤\n3반 : 정다원 쌤\n4반 : 이안건 쌤\n5반 : 현수은 쌤\n6반 : 한수정 쌤\n오케이?`],["익명","윗댓글 어케 아는거냐ㄷㄷ 위키백과네"],["↳ 익명","위키백과가 아니라 나무위키겠지;"]]},
{id:8,title:"일월회 담당 쌤 누구임?",author:"2109_namyera",body:`오늘 일월회 초청 당했는데 담당쌤이 누구?`,comments:[["익명","한수정 쌤이요\n참고로 일월회 담당 쌤은 다 기가쌤"],["익명","와 일월회라니 개부럽다.. 나도 초청 받고 싶다.... 언제 감?"],["↳ 익명","11월 2일! 너무 기대됨... 이번이 처음 아님?"],["↳↳ 익명","ㅇㅇ 제 1회 일월회임!"]]},
{id:9,title:"채시화 쌤 사랑해요ㅠㅠ",author:"ilovechaesihwa",body:`너무 예뻐요 쌤ㅜㅜ`,comments:[["익명","놉 이미 내가 점령함"],["↳ 익명","? 내가 먼저임;;"],["↳↳ 익명","역시 미술쌤의 덕목 제 1장. 예뻐라 이게 맞는건가ㄷㄷ"]]},
{id:10,title:"종교 과정 설명회 후기!",author:"w61_tsy799",body:`오늘 종교 과정 설명회를 갔다 왔음!!\n후기 끄적끄적 해 봄. (참고로 난 2학년!)\n일단 체육관에서 하는데 연장쌤이랑 현주쌤 계시고 2학년만 오는 설명회였는데\n담임쌤 계셔서 반가웠음,\n사람들 모이고 각자 반대로 앉았음. 반별로 2명 정도 있었음!\n그러고서 교장쌤 들어오고선 우리 학교의 종교 관념이랑\n여러 정보 알려주다가 교장쌤 내려가고\n권태쌤 올라가서 평소에 하던 월절함.\n그러고선 무슨 키캡? 추첨으로 나눠주고 끝남. 심지어 난 못받음.\n..... 쓰읍`,comments:[["익명","시화쌤 말로는 재밌는거 많이 한다 했는디.."],["↳ 익명","오 혹시 2학년 1반임?"],["↳↳ 익명","ㅇㅇ 맞음"],["↳↳↳ 익명","나도! 너 누구임?"]]}
];

let lastQuery = "";

function makeCard(post) {
  return `
    <div class="card" onclick="openPost(${post.id})">
      <div class="meta">작성자 ${post.author}</div>
      <h3>${post.title}</h3>
      <div class="preview">${post.body.slice(0, 90).replace(/\\n/g, " ")}...</div>
    </div>
  `;
}


function search() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  if (!q) return;

  lastQuery = q;
  const matches = posts.filter(p =>
    [p.title, p.author, p.body, ...p.comments.flat()].join(" ").toLowerCase().includes(q)
  );

  document.getElementById("home").classList.add("hidden");
  document.getElementById("postPage").classList.add("hidden");
  document.getElementById("results").classList.remove("hidden");

  document.getElementById("resultTitle").textContent =
    `"${document.getElementById("searchInput").value.trim()}" 검색 결과 (${matches.length})`;

  document.getElementById("resultList").innerHTML = matches.length
    ? matches.map(makeCard).join("")
    : `<div class="no-result">검색 결과가 없습니다.</div>`;
}

function quickSearch(q) {
  document.getElementById("searchInput").value = q;
  search();
}

function openPost(id) {
  const p = posts.find(x => x.id === id);
  if (!p) return;

  document.getElementById("home").classList.add("hidden");
  document.getElementById("results").classList.add("hidden");
  document.getElementById("postPage").classList.remove("hidden");

  document.getElementById("postContent").innerHTML = `
    <div class="post">
      <div class="meta">작성자 ${p.author}</div>
      <h1>${p.title}</h1>
      <div class="post-body">${escapeHTML(p.body)}<div class="author-id">작성자: <code>${escapeHTML(p.author)}</code></div></div>
      ${p.id === 3 ? `<div class="clue">🔎 <strong>단서:</strong> 이 글에서 반복해서 등장하는 숫자를 다음 검색에 사용해 보세요.</div>` : ""}
      <div style="margin-top:35px;font-weight:700;">댓글 ${p.comments.length}</div>
      ${p.comments.map(c => `
        <div class="comment">
          <strong>${escapeHTML(c[0])}</strong>
          <p>${escapeHTML(c[1])}</p>
        </div>
      `).join("")}
    </div>
  `;
}

function escapeHTML(text) {
  return text.replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
  }[c]));
}

function goHome() {
  document.getElementById("results").classList.add("hidden");
  document.getElementById("postPage").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");
}

function goResults() {
  document.getElementById("postPage").classList.add("hidden");
  document.getElementById("results").classList.remove("hidden");
}

document.getElementById("searchInput").addEventListener("keydown", e => {
  if (e.key === "Enter") search();
});

</script>

</body>
</html>
